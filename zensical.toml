[project]
site_name = "ChengZhang's Site - Imperial College London, UK"
site_url = "https://chengzhang-98.github.io/"

extra_css = [
  "stylesheets/extra.css",
  "https://unpkg.com/katex@0/dist/katex.min.css",
]
extra_javascript = [
  "javascripts/katex.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]

[project.theme]
# Zensical's default is the new "modern" look. Uncomment to get the
# mkdocs-material look back.
# variant = "classic"
language = "en"
logo = "assets/orange_logo.png"
favicon = "assets/orange_logo.png"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
]

[project.theme.font]
text = "Roboto Slab"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "cyan"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.extra]
generator = true

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:chengzhang98@outlook.com"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/chengzhang98"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ChengZhang-98"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight.anchor_linenums = true
tables = {}
footnotes = {}
pymdownx.critic = {}
pymdownx.caret = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tilde = {}
def_list = {}
pymdownx.tasklist.custom_checkbox = true
pymdownx.arithmatex.generic = true
